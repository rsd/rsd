# RSD VM Management — Default Configuration
#
# Override per-user in ~/.config/rsd/vm.ini
# Values here serve as fallback defaults.

[defaults]
driver=libvirt
mode=session
user=rsd
ram=2G
vcpus=2
disk=20G
key=~/.ssh/id_ed25519.pub
bootstrap=true

[cache]
dir=~/.local/share/rsd/vm/cache/
enabled=true
